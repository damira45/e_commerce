<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroHub - African Electronics Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        /* Animated Banner */
        .banner {
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #667eea);
            background-size: 300% 300%;
            animation: gradientShift 8s ease infinite;
            padding: 40px 20px;
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .banner h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: bounce 3s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .banner p {
            font-size: 1.4rem;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .banner .icon {
            font-size: 3rem;
            margin-right: 15px;
        }

        /* Main Container */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .header h2 {
            font-size: 1.8rem;
            color: #333;
        }

        .header-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .cart-toggle {
            position: relative;
            cursor: pointer;
            font-size: 2.5rem;
            transition: transform 0.3s;
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 10px;
        }

        .cart-toggle:hover {
            transform: scale(1.1);
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff6b6b;
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Main Layout */
        .layout {
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 30px;
        }

        .layout.full {
            grid-template-columns: 1fr;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.3);
        }

        .product-image {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.1);
        }

        .product-info {
            padding: 25px;
        }

        .product-name {
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #333;
        }

        .product-description {
            font-size: 1rem;
            color: #666;
            margin-bottom: 15px;
            min-height: 45px;
            line-height: 1.5;
        }

        .product-rating {
            font-size: 1rem;
            color: #ff9800;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .product-price {
            font-size: 1.6rem;
            font-weight: 700;
            color: #667eea;
        }

        .add-to-cart-btn {
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.05rem;
            transition: all 0.3s ease;
        }

        .add-to-cart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .add-to-cart-btn:active {
            transform: scale(0.95);
        }

        /* Cart Sidebar */
        .cart-sidebar {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            height: fit-content;
            position: sticky;
            top: 140px;
        }

        .cart-sidebar h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }

        .cart-empty {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 1.2rem;
        }

        .cart-items {
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            flex-direction: column;
            padding: 15px;
            border-bottom: 2px solid #eee;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .cart-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .cart-item-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: #333;
            flex: 1;
        }

        .cart-item-price {
            font-weight: 700;
            color: #667eea;
            font-size: 1.1rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: space-between;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #667eea;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #667eea;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .qty-btn:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        .qty-display {
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 30px;
            text-align: center;
        }

        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .cart-total {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
            color: white;
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }

        .checkout-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            margin-top: 20px;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .checkout-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
        }

        /* Success Message */
        .success-message {
            position: fixed;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            animation: slideInRight 0.4s ease;
            font-size: 1.1rem;
            font-weight: 600;
            z-index: 2000;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(500px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .cart-sidebar {
                position: static;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .banner h1 {
                font-size: 2rem;
            }

            .banner p {
                font-size: 1rem;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }

            .header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Banner -->
    <div class="banner">
        <h1><span class="icon">🛒</span>ElectroHub Africa</h1>
        <p>✨ Premium Electronics at Unbeatable Prices ✨</p>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h2>Our Products</h2>
            <div class="header-info">
                <div class="cart-toggle" onclick="toggleCart()">
                    🛍️
                    <div class="cart-count" id="cartCount" style="display: none;">0</div>
                </div>
            </div>
        </div>

        <div id="successMessage" class="success-message" style="display: none;"></div>

        <!-- Main Layout -->
        <div class="layout" id="mainLayout">
            <!-- Products -->
            <div class="products-grid" id="productsContainer"></div>

            <!-- Cart Sidebar -->
            <div id="cartSidebar" class="cart-sidebar" style="display: none;">
                <h2>🛒 Your Cart</h2>
                <div class="cart-items" id="cartItems"></div>
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cartTotal">0 FCFA</span>
                </div>
                <button class="checkout-btn" onclick="checkout()">✅ Checkout</button>
            </div>
        </div>
    </div>

    <script>
        // Product Data with Real Images
        const products = [
            {
                id: 1,
                name: "Wireless Earbuds Pro",
                description: "Premium noise-cancelling earbuds with 48hr battery",
                price: 45000,
                rating: 4.9,

            },
            {

                description: "Fitness tracking, heart rate monitor, 7-day battery",
                price: 75000,
                rating: 4.8,
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&h=600&fit=crop"
            },
            {
                id: 3,
                name: "4K Webcam Pro",
                description: "Crystal clear streaming, auto-focus, built-in mic",
                price: 55000,
                rating: 4.7,
                image: "https://images.unsplash.com/photo-1598849465640-5bfb2e76f6b7?w=600&h=600&fit=crop"
            },
            {
                id: 4,
                name: "USB-C Hub 7-in-1",
                description: "Multi-port adapter for all your devices",
                price: 18000,
                rating: 4.6,
                image: "https://images.unsplash.com/photo-1625948515291-69613efd103f?w=600&h=600&fit=crop"
            },
            {
                id: 5,
                name: "Portable Bluetooth Speaker",
                description: "Waterproof, 360° sound, 20hr battery life",
                price: 28000,
                rating: 4.8,
                image: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=600&h=600&fit=crop"
            },
            {
                id: 6,
                name: "Wireless Charging Pad",
                description: "Fast 15W charging for all Qi devices",
                price: 12000,
                rating: 4.5,
                image: "https://images.unsplash.com/photo-1591637281649-76ce14b2167e?w=600&h=600&fit=crop"
            },
            {
                id: 7,
                name: "Gaming Mouse RGB",
                description: "16,000 DPI, ergonomic design, programmable buttons",
                price: 22000,
                rating: 4.9,
                image: "https://images.unsplash.com/photo-1527814050087-3793815479db?w=600&h=600&fit=crop"
            },
            {
                id: 8,
                name: "Mechanical Keyboard",
                description: "RGB lighting, hot-swap switches, aluminum frame",
                price: 48000,
                rating: 4.9,
                image: "https://images.unsplash.com/photo-1587829191301-26e96b6d6e20?w=600&h=600&fit=crop"
            },
            {
                id: 9,
                name: "Adjustable Laptop Stand",
                description: "Ergonomic aluminum design, adjustable height",
                price: 15000,
                rating: 4.7,
                image: "https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=600&h=600&fit=crop"
            },
            {
                id: 10,
                name: "Magnetic Car Phone Mount",
                description: "Dashboard mount, strong magnet, universal fit",
                price: 8000,

                image: "https://images.unsplash.com/photo-1606708232652-49d60ca1bc84?w=600&h=600&fit=crop"
            },
            {

                description: "Anti-scratch, universal fit, 2.5D curved edges",
                price: 5000,

            },
            {
                id: 12,
                name: "USB 3.1 Flash Drive 1TB",
                description: "Ultra-fast transfer speeds, compact design",
                price: 35000,
                rating: 4.8,
                image: "https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?w=600&h=600&fit=crop"
            },
            {
                id: 13,
                name: "Wireless Mouse",
                description: "Silent click, 18-month battery, precision tracking",
                price: 16000,
                rating: 4.7,
                image: "https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=600&h=600&fit=crop"
            },
            {
                id: 14,
                name: "HD Monitor 24 Inch",
                description: "1080P resolution, 75Hz refresh rate, eye-care",
                price: 65000,
                rating: 4.6,
                image: "https://images.unsplash.com/photo-1598936160826-78ba4d63dda5?w=600&h=600&fit=crop"
            },
            {
                id: 15,
                name: "Phone Case & Screen Combo",
                description: "Protective case + tempered glass bundle",
                price: 12000,
                rating: 4.5,
                image: "https://images.unsplash.com/photo-1611532736579-6b16e2b50449?w=600&h=600&fit=crop"
            },
            {
                id: 16,
                name: "Power Bank 20000mAh",
                description: "Fast charging, dual USB ports, compact design",
                price: 18000,
                rating: 4.8,
                image: "https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=600&h=600&fit=crop"
            },
            {
                id: 17,
                name: "Portable SSD 1TB",
                description: "Lightning-fast storage, durability tested",
                price: 55000,
                rating: 4.9,
                image: "https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?w=600&h=600&fit=crop"
            },
            {
                id: 18,
                name: "Bluetooth Headphones",
                description: "Premium sound quality, 30hr battery, comfortable fit",
                price: 32000,
                rating: 4.7,
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&h=600&fit=crop"
            },
            {
                id: 19,
                name: "USB-C Cable 3 Pack",
                description: "Durable braided cables, fast charging support",
                price: 9000,
                rating: 4.6,
                image: "https://images.unsplash.com/photo-1625948515291-69613efd103f?w=600&h=600&fit=crop"
            },
            {
                id: 20,
                name: "Laptop Cooling Pad",
                description: "Dual fans, USB powered, adjustable height",
                price: 14000,
                rating: 4.5,
                image: "https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=600&h=600&fit=crop"
            }
        ];

        let cart = [];

        // Initialize
        function init() {
            renderProducts();
        }

        // Render Products
        function renderProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        <img src="${product.image}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/600x600?text=${product.name}'">
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-description">${product.description}</div>
                        <div class="product-rating">⭐ ${product.rating} (${Math.floor(Math.random() * 800) + 100} reviews)</div>
                        <div class="product-footer">
                            <div class="product-price">${product.price.toLocaleString()} FCFA</div>
                            <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Add to Cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCart();
            showCart();
            showSuccess(`✅ ${product.name} added to cart!`);
        }

        // Remove from Cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        // Update Quantity
        function updateQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    updateCart();
                }
            }
        }

        // Update Cart Display
        function updateCart() {
            const total = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartCount = document.getElementById('cartCount');
            
            if (total > 0) {
                cartCount.textContent = total;
                cartCount.style.display = 'flex';
            } else {
                cartCount.style.display = 'none';
            }

            renderCartItems();
        }

        // Render Cart Items
        function renderCartItems() {
            const cartItemsDiv = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<div class="cart-empty">Your cart is empty 🛒</div>';
            } else {
                cartItemsDiv.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-header">
                            <div class="cart-item-name">${item.name}</div>
                            <button class="remove-btn" onclick="removeFromCart(${item.id})">✕ Remove</button>
                        </div>
                        <div class="cart-item-controls">
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">−</button>
                                <div class="qty-display">${item.quantity}</div>
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                            </div>
                            <div class="cart-item-price">${(item.price * item.quantity).toLocaleString()} FCFA</div>
                        </div>
                    </div>
                `).join('');
            }

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cartTotal').textContent = `${totalPrice.toLocaleString()} FCFA`;
        }

        // Toggle Cart
        function toggleCart() {
            const cartSidebar = document.getElementById('cartSidebar');
            const mainLayout = document.getElementById('mainLayout');
            
            if (cart.length === 0) {
                alert('Your cart is empty! Add some products first 🛍️');
                return;
            }

            if (cartSidebar.style.display === 'none') {
                showCart();
            } else {
                hideCart();
            }
        }

        function showCart() {
            const cartSidebar = document.getElementById('cartSidebar');
            const mainLayout = document.getElementById('mainLayout');
            cartSidebar.style.display = 'block';
            mainLayout.classList.remove('full');
        }

        function hideCart() {
            const cartSidebar = document.getElementById('cartSidebar');
            const mainLayout = document.getElementById('mainLayout');
            cartSidebar.style.display = 'none';
            mainLayout.classList.add('full');
        }

        // Checkout
        function checkout() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const items = cart.map(item => `${item.quantity}x ${item.name}`).join('\n');
            
            alert(`🎉 Order Confirmed!\n\nItems:\n${items}\n\nTotal: ${total.toLocaleString()} FCFA\n\nThank you for your purchase!`);
            
            cart = [];
            updateCart();
            hideCart();
            showSuccess('✅ Order placed successfully!');
        }

        // Show Success Message
        function showSuccess(message) {
            const msg = document.getElementById('successMessage');
            msg.textContent = message;
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 3500);
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
